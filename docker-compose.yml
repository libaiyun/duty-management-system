services:
  backend:
    build: .
    env_file: ./deploy/env/dev.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - duty_net

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: duty_system
      POSTGRES_USER: duty_app
      POSTGRES_PASSWORD: duty_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duty_app -d duty_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - duty_net

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - duty_net

volumes:
  postgres_data:
  redis_data:

networks:
  duty_net:
